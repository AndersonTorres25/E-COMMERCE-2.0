    <main class="contato">
        <form class="formulario" method="get" action="sucesso-contato.html">
            <div class="mb-3">
                <h1>Entre em contato</h1>

                <label class="form-label">Nome *</label>
                <input type="text" class="form-control" name="nome" required autofocus placeholder="Digite um nome" />


                <label class="form-label">E-mail *</label>
                <input type="email" class="form-control" name="email" required placeholder="Digite um e-mail">

                <label class="form-label">Telefone</label>
                <input type="tel" class="form-control" name="Telefone" pattern="[0-9]{10,11}"
                    placeholder="Digite somente números (DDD + telefone)"
                    title="Digite 10 ou 11 números, incluindo o DDD." />

                <label for="assunto" class="form-label">Assunto</label>
                <select class="form-select" id="assunto" name="assunto">
                    <option value="none" disabled selected>selecione um assunto</option>
                    <option>Compra</option>
                    <option>Suporte</option>
                    <option>Troca</option>
                    <option>Outros</option>
                </select>
                <label for="mensagem" class="form-label">Mensagem</label>
                <textarea class="form-control" name="mensagem" rows="8" cols="40"
                    placeholder="Digite o texto aqui."></textarea>
                <input class="btn btn-success botao-enviar" type="submit" value="Enviar mensagem" />
            </div>
        </form>

    </main>
