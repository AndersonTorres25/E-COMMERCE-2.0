    <link rel="icon" href="../imagens/index/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

</head>

<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary minha-nav">
        <div class="container-fluid">
            <a class="navbar-brand" href="../index.html"> <img src="../imagens/SHOP-TADS.png" alt="Shop TADS"
                    width="50">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item dropdown dropdown-usuario">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            <img src="../imagens/login/login.png" width="30">

                            <span id="nomeUsuario">Entrar / Cadastrar</span>
                        </a>
                        <ul class="dropdown-menu">
                            <li id="menuLogin"><a class="dropdown-item" href="login.html">Login</a></li>
                            <li id="menuCadastro"><a class="dropdown-item" href="novo-usuario.html">Cadastrar</a></li>


                            <li id="menuPerfil" style="display:none;">
                                <a class="dropdown-item" href="dados_pessoais.html">Meus dados</a>
                            </li>

                            <li id="menuPedidos" style="display:none;">
                                <a class="dropdown-item" href="meus-pedidos.html">Meus Pedidos</a>
                            </li>

                            <li id="menuSair" style="display:none;">
                                <a class="dropdown-item text-danger" href="#" id="btnSair">
                                    Sair
                                </a>
                            </li>

                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../paginas/produtos.html">Produtos</a>

                        <a class="nav-link" href="../paginas/contato.html">Contato</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link position-relative" href="../paginas/carrinho.html">

                            <img id="iconeCarrinho" src="../imagens/carrinho/carrinho.png" width="23px" alt="Carrinho">

                            <span id="badgeCarrinho" class="position-absolute badge rounded-pill bg-danger">
                                0
                            </span>

                        </a>
                    </li>


                </ul>

            </div>
        </div>
    </nav>

    <main class="principal">
        <div class="container py-5">

            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
                <h2 class="mb-0">Meus endereços</h2>

                <button type="button" id="btnNovoEndereco" class="btn btn-success" data-bs-toggle="modal"
                    data-bs-target="#modalEndereco">
                    <i class="bi bi-plus-circle"></i> Cadastrar Novo Endereço
                </button>
            </div>

            <div id="mensagemSemEnderecos" class="text-center py-5" hidden>
                <i class="bi bi-geo-alt fs-1"></i>
                <p class="mt-2">Você ainda não cadastrou nenhum endereço.</p>
            </div>

            <div id="listaEnderecos" class="row g-3"></div>

        </div>
    </main>

    <!-- Modal de cadastro de endereço -->
    <div class="modal fade" id="modalEndereco" tabindex="-1" aria-labelledby="tituloModalEndereco" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <form id="form-endereco" novalidate>

                    <div class="modal-header">
                        <h5 class="modal-title" id="tituloModalEndereco">Novo endereço</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>

                    <div class="modal-body">

                        <div id="erroEndereco" class="alert alert-danger" hidden></div>

                        <div class="mb-3">
                            <label for="enderecoRua" class="form-label">Rua</label>
                            <input type="text" id="enderecoRua" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label for="enderecoNumero" class="form-label">Número</label>
                            <input type="text" id="enderecoNumero" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label for="enderecoCep" class="form-label">CEP</label>
                            <input type="text" id="enderecoCep" class="form-control" placeholder="00000-000"
                                maxlength="9">
                        </div>

                        <div class="mb-3">
                            <label for="enderecoCidade" class="form-label">Cidade/Estado</label>
                            <input type="text" id="enderecoCidade" class="form-control" placeholder="Ex.: Formosa/GO">
                        </div>

                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Cancelar
                        </button>

                        <button type="button" id="btnSalvarEndereco" class="btn btn-success">
                            Salvar endereço
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="../js/script.js?v=2"></script>
</body>

</html>
