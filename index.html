            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"

            </button>

                    <li class="nav-item dropdown dropdown-usuario">

                        </a>
                        <ul class="dropdown-menu">
                            <li id="menuLogin"><a class="dropdown-item" href="paginas/login.html">Login</a></li>

                                    href="paginas/novo-usuario.html">Cadastrar</a></li>

                                <a class="dropdown-item" href="paginas/meus-pedidos.html">Meus Pedidos</a>
                            </li>


                            <li id="menuSair" style="display:none;">
                                <a class="dropdown-item text-danger" href="#" id="btnSair">
                                    Sair
                                </a>
                            </li>

                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="paginas/produtos.html">Produtos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="paginas/contato.html">Contato</a>
                    </li>
                    <li class="nav-item">

                            <span id="badgeCarrinho" class="position-absolute badge rounded-pill bg-danger">
                                0
                            </span>

                <form class="d-flex" role="search">

                </form>

        </div>

    <main class="principal">
        <marquee onmouseover="this.stop()" onmouseout="this.start()" width="100%" direction="right">

            <h1 style="text-align:center;">
                Bem-vindo ao Shop TADS
            </h1>

        </marquee>
        <div id="carouselExampleIndicators" class="carousel slide">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"
                    aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
                    aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
                    aria-label="Slide 3"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="imagens/index/BANNER1.png" class="d-block w-100" alt="BANNER">
                    <div class="botoes-banner d-flex flex-wrap gap-2">
                        <a href="paginas/produtos.html" class="btn btn-success btn-lg">
                            Produtos
                        </a>

                        <a href="paginas/contato.html" class="btn btn-success btn-lg">
                            Contato
                        </a>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="imagens/index/BANNER2.png" class="d-block w-100" alt="BANNER-2">

                <div class="carousel-item">
                    <img src="imagens/index/BANNER3.png" class="d-block w-100" alt="BANNER-3">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
                data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
                data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
